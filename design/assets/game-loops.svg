<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-labelledby="game-loops-title game-loops-desc">
<title id="game-loops-title">子时已到：操作、单局、局外游戏循环</title>
<desc id="game-loops-desc">手动齐射以连击增强自动火力，关卡清场后选卡并进入下一关，挑战结束后结算资源并用于局外成长，再次出击读取成长快照。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#78818F"/></marker></defs>
<rect width="1200" height="980" fill="#FFFFFF"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="48" y="60" font-size="32" font-weight="600" fill="#272C35">《子时已到》游戏循环</text>
<text x="48" y="96" font-size="16" fill="#626C7A">当前正式 Unity 游戏 · 操作循环、单局循环与局外成长</text>
<line x1="48" y1="128" x2="1152" y2="128" stroke="#E4E7EC"/>
<text x="48" y="184" font-size="16" fill="#6A6388">01</text>
<text x="48" y="220" font-size="24" font-weight="600" fill="#272C35">操作循环</text>
<text x="48" y="248" font-size="14" fill="#626C7A">反复进行的战斗决策</text>
<path d="M504 204 H576" fill="none" stroke="#78818F" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M824 204 H896" fill="none" stroke="#78818F" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1024 248 V292 Q1024 300 1016 300 H392 Q384 300 384 292 V256" fill="none" stroke="#9DA5B1" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="492" y="268" width="424" height="24" fill="white"/><text x="704" y="284" text-anchor="middle" font-size="15" fill="#626C7A">超载增强下一段自动火力</text>
<rect x="264" y="160" width="240" height="88" rx="8" fill="#FAFBFC" stroke="#CDD3DC"/>
<text x="384" y="196" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">自动攻击</text><text x="384" y="224" text-anchor="middle" font-size="16" fill="#626C7A">恢复耐力，观察场面</text>
<rect x="584" y="160" width="240" height="88" rx="8" fill="#FAFBFC" stroke="#CDD3DC"/>
<text x="704" y="196" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">锁敌齐射</text><text x="704" y="224" text-anchor="middle" font-size="16" fill="#626C7A">长按锁定，松手射击</text>
<rect x="904" y="160" width="240" height="88" rx="8" fill="#F3F0F9" stroke="#9B8CB7"/>
<text x="1024" y="196" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">连击与超载</text><text x="1024" y="224" text-anchor="middle" font-size="16" fill="#626C7A">破绽增益，连击添柴</text>
<text x="264" y="340" font-size="15" fill="#626C7A">主动技能穿插使用：处理敌群、恢复耐力与化解近身压力。</text>
<line x1="48" y1="384" x2="1152" y2="384" stroke="#E4E7EC"/>
<text x="48" y="440" font-size="16" fill="#6A6388">02</text>
<text x="48" y="476" font-size="24" font-weight="600" fill="#272C35">单局循环</text>
<text x="48" y="504" font-size="14" fill="#626C7A">单次挑战的关卡流程</text>
<path d="M504 460 H576" fill="none" stroke="#78818F" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M824 460 H896" fill="none" stroke="#78818F" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1024 504 V548 Q1024 556 1016 556 H392 Q384 556 384 548 V512" fill="none" stroke="#9DA5B1" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="492" y="524" width="424" height="24" fill="white"/><text x="704" y="540" text-anchor="middle" font-size="15" fill="#626C7A">保留局内成长，进入后续关卡</text>
<rect x="264" y="416" width="240" height="88" rx="8" fill="#FAFBFC" stroke="#CDD3DC"/>
<text x="384" y="452" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">关卡作战</text><text x="384" y="480" text-anchor="middle" font-size="16" fill="#626C7A">击破敌人，收集卡片</text>
<rect x="584" y="416" width="240" height="88" rx="8" fill="#FAFBFC" stroke="#CDD3DC"/>
<text x="704" y="452" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">清场处理</text><text x="704" y="480" text-anchor="middle" font-size="16" fill="#626C7A">等待攻击、拾取与添柴</text>
<rect x="904" y="416" width="240" height="88" rx="8" fill="#FAFBFC" stroke="#CDD3DC"/>
<text x="1024" y="452" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">局内选卡</text><text x="1024" y="480" text-anchor="middle" font-size="16" fill="#626C7A">选择升级，强化局内能力</text>
<text x="264" y="596" font-size="15" fill="#626C7A">各关卡重复操作循环；最终关卡结束后进入结算流程。</text>
<rect x="828" y="424" width="72" height="24" fill="white"/><text x="864" y="440" text-anchor="middle" font-size="13" fill="#626C7A">非最终关卡</text>
<line x1="48" y1="640" x2="1152" y2="640" stroke="#E4E7EC"/>
<text x="48" y="696" font-size="16" fill="#6A6388">03</text>
<text x="48" y="732" font-size="24" font-weight="600" fill="#272C35">局外循环</text>
<text x="48" y="760" font-size="14" fill="#626C7A">资源与长期成长</text>
<path d="M504 716 H576" fill="none" stroke="#78818F" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M824 716 H896" fill="none" stroke="#78818F" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1024 760 V804 Q1024 812 1016 812 H392 Q384 812 384 804 V768" fill="none" stroke="#9DA5B1" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="492" y="780" width="424" height="24" fill="white"/><text x="704" y="796" text-anchor="middle" font-size="15" fill="#626C7A">挑战结束，结算资源与进度</text>
<rect x="264" y="672" width="240" height="88" rx="8" fill="#FAFBFC" stroke="#CDD3DC"/>
<text x="384" y="708" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">胜败结算</text><text x="384" y="736" text-anchor="middle" font-size="16" fill="#626C7A">胜利入账，失败退出领取</text>
<rect x="584" y="672" width="240" height="88" rx="8" fill="#F3F0F9" stroke="#9B8CB7"/>
<text x="704" y="708" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">局外成长</text><text x="704" y="736" text-anchor="middle" font-size="16" fill="#626C7A">强化、皮肤与永久技能</text>
<rect x="904" y="672" width="240" height="88" rx="8" fill="#FAFBFC" stroke="#CDD3DC"/>
<text x="1024" y="708" text-anchor="middle" font-size="22" font-weight="600" fill="#272C35">再次出击</text><text x="1024" y="736" text-anchor="middle" font-size="16" fill="#626C7A">读取成长，保存本局快照</text>
<text x="264" y="852" font-size="15" fill="#626C7A">死亡可先选择复活并继续同一局；商城、每日补给、同行证提供额外来源。</text>
<line x1="48" y1="896" x2="1152" y2="896" stroke="#E4E7EC"/>
<text x="48" y="932" font-size="16" font-weight="600" fill="#494359">层间关系</text>
<text x="160" y="932" font-size="16" fill="#626C7A">选卡改变局内能力；结算更新账号资源；永久成长在下一次出击时生效。</text>
<text x="48" y="960" font-size="13" fill="#7D8795">图示为当前实现概览。新提出的“教程后约 6 → 8 → 10 关”节奏意图另见关卡节奏规格，尚未改入游戏。</text>
</g></svg>
