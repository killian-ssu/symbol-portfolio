<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#081a35">
  <meta name="description" content="子时已到：长按瞄准，松手射击。Unity 网页试玩。">
  <title>子时已到 · 网页试玩</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preload" href="loading.jpg" as="image">
  <link rel="preload" href="title.png" as="image">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060e20;color:#f7e6b5;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#153958,#060e20 76%)}
    #game{position:relative;width:min(100vw,calc(100dvh * .54));height:100dvh;max-width:720px;overflow:hidden;background:#081b34;box-shadow:0 0 100px #0009}
    canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;-webkit-user-select:none;user-select:none}
    #loading{position:absolute;inset:0;z-index:2;background:#081a35 url('loading.jpg') center/cover no-repeat}
    #logo{position:absolute;left:50%;width:84%;top:23%;height:auto;transform:translateX(-50%);filter:drop-shadow(0 3px 3px #00152880)}
    .loading-progress{position:absolute;left:15%;width:70%;top:69.2%;text-align:center;color:#fff;text-shadow:0 1px 3px #001128,0 0 8px #001128}
    #status{font-size:13px;font-weight:500;line-height:20px;margin:0 0 28px;letter-spacing:.04em}
    #progress{position:relative;height:18px;border-radius:4px;background:#102c54;box-shadow:0 1px 5px #001128b0}
    #progress::after{content:"";position:absolute;inset:0;pointer-events:none;border:solid transparent;border-width:7px;border-image:url('assets/progress-frame.png?v=8f6e47d9913a') 7 fill / 7px;opacity:.85}
    .progress-track{position:absolute;inset:3px;overflow:hidden;border-radius:4px}
    #progress-fill{height:100%;width:0;border:solid transparent;border-width:6px 5px;border-image:url('assets/progress-fill.png?v=5f5c794ebada') 14 10 fill / 6px 5px;min-width:0}
    #progress-fill.empty{visibility:hidden}
    #percent{display:block;font-size:12px;line-height:18px;font-weight:600;margin-top:10px;font-variant-numeric:tabular-nums}
    #retry{font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid #8ee9ff;border-radius:6px;background:#082c58ee;color:#fff;padding:10px 24px;min-height:44px;margin-top:12px}
    #retry:focus-visible{outline:3px solid #83e8ff;outline-offset:4px}
    #error{font-size:13px;line-height:1.6;color:#ffe6d2;background:#071b38e6;border-radius:8px;padding:10px;margin:0}
    #storage-warning{position:absolute;bottom:8px;left:8px;right:8px;z-index:5;padding:10px;background:#4d261fee;border-radius:8px;font-size:12px;text-align:center}
    .hidden{display:none!important}#loading.done{pointer-events:none;opacity:0;transition:opacity .35s}#play-hint{position:fixed;right:24px;bottom:22px;color:#7a9dad;font-size:12px;line-height:1.8;text-align:right;pointer-events:none}
    @media(max-width:760px){#game{width:100vw;max-width:none}#play-hint{display:none}}
    @media(prefers-reduced-motion:reduce){#loading.done{transition:none}}
  </style>
</head>
<body>
  <main id="game" aria-label="子时已到游戏">
    <canvas id="unity-canvas" width="720" height="1334" tabindex="0" aria-label="游戏画面：长按瞄准，松手射击"></canvas>
    <section id="loading" aria-label="正在加载子时已到">
      <img id="logo" src="title.png" alt="子时已到">
      <div class="loading-progress">
        <p id="status" role="status">正在进入子时已到…</p>
        <div id="progress" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-track"><div id="progress-fill" class="empty"></div></div>
        </div>
        <span id="percent" aria-hidden="true">0%</span>
        <p id="error" class="hidden" role="alert"></p>
        <button id="retry" class="hidden">重新加载</button>
      </div>
    </section>
    <div id="storage-warning" class="hidden" role="status">当前浏览器无法持久保存进度，关闭页面后可能丢失。建议使用普通模式的 Safari 或 Chrome。</div>
  </main>
  <aside id="play-hint">长按瞄准，松手射击<br>推荐竖屏 · 各浏览器独立保存进度</aside>
  <script src="web-player.js?v=11dd336f35fc"></script>
</body>
</html>
