<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#081a35">
  <meta name="description" content="子时已到：长按瞄准，松手射击。Unity 网页试玩。">
  <title>子时已到 · 网页试玩</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preload" href="loading.jpg?v=30e734035eec" as="image">
  <link rel="preload" href="title.png?v=a83702502cb0" as="image">
  <style>
    @font-face{font-family:NoonBoot;src:url('assets/boot-text.ttf?v=e2d62f875c6e') format('truetype');font-display:swap}
    @font-face{font-family:NoonBootNumber;src:url('assets/boot-number.ttf?v=1feb05f9c313') format('truetype');font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060e20;color:#f7e6b5;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#153958,#060e20 76%)}
    #game{position:relative;width:min(100vw,calc(100dvh * .54));height:100dvh;max-width:720px;overflow:hidden;background:#081b34;box-shadow:0 0 100px #0009}
    canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;-webkit-user-select:none;user-select:none}
    #loading{position:absolute;inset:0;z-index:2;background:#081a35 url('loading.jpg?v=30e734035eec') center/cover no-repeat}
    #loading-art{position:absolute;left:50%;top:50%;width:max(100%,calc(100dvh * .45));aspect-ratio:9/20;transform:translate(-50%,-50%);--u:.5px}
    #loading-safe-area{position:absolute;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}
    #logo{position:absolute;left:2.811641%;width:94.400766%;top:16.506073%;height:auto}
    .loading-progress{position:absolute;inset:0;text-align:center;color:#f4fbff;font-family:NoonBoot,sans-serif;text-shadow:0 calc(1 * var(--u)) calc(1.5 * var(--u)) #45405f;-webkit-text-stroke:calc(1.1 * var(--u)) #45405f;paint-order:stroke fill}
    .loading-progress::before{content:"";position:absolute;left:0;right:0;top:77.1875%;bottom:0;background:linear-gradient(#18213b00,#18213b75 43%,#18213b66);pointer-events:none}
    #status{position:absolute;left:50%;top:80.125%;width:calc(320 * var(--u));height:calc(40 * var(--u));transform:translateX(-50%);font-size:calc(27 * var(--u));line-height:calc(40 * var(--u));margin:0;white-space:nowrap}
    #progress{position:absolute;left:11.111111%;width:77.777778%;top:83.4375%;height:calc(50 * var(--u));background:url('assets/progress-frame.png?v=c224ca486e56') center/100% 100% no-repeat}
    .progress-track{position:absolute;left:2.857143%;top:24%;width:94.285714%;height:50%;overflow:hidden;border-radius:999px}
    #progress-fill{height:100%;width:0;min-width:0;border-radius:999px;background:#83dddd url('assets/progress-fill.png?v=6fd4cc7e1abc') center/100% 100% no-repeat}
    #progress-fill.empty{visibility:hidden}
    #percent{position:absolute;right:12.222222%;top:80.125%;font:calc(29 * var(--u))/calc(40 * var(--u)) NoonBootNumber,NoonBoot,sans-serif;font-variant-numeric:tabular-nums}
    #control-hint{position:absolute;left:6.944444%;width:86.111111%;top:87.125%;height:calc(40 * var(--u));font-size:calc(25 * var(--u));line-height:calc(40 * var(--u));margin:0;color:#e0eff7}
    #retry{font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid #8ee9ff;border-radius:6px;background:#082c58ee;color:#fff;padding:10px 24px;min-height:44px;margin-top:12px}
    #retry:focus-visible{outline:3px solid #83e8ff;outline-offset:4px}
    #load-error-actions{position:absolute;left:10%;right:10%;bottom:10%;font-family:NoonBoot,sans-serif;text-align:center}
    #error{font-size:13px;line-height:1.6;color:#ffe6d2;background:#071b38e6;border-radius:8px;padding:10px;margin:0}
    #storage-warning{position:absolute;bottom:8px;left:8px;right:8px;z-index:5;padding:10px;background:#4d261fee;border-radius:8px;font-size:12px;text-align:center}
    .hidden{display:none!important}#loading.done{pointer-events:none;opacity:0;transition:opacity .22s}#play-hint{position:fixed;right:24px;bottom:22px;color:#7a9dad;font-size:12px;line-height:1.8;text-align:right;pointer-events:none}
    @media(max-width:760px){#game{width:100vw;max-width:none}#play-hint{display:none}}
    @media(prefers-reduced-motion:reduce){#loading.done{transition:none}}
  </style>
</head>
<body>
  <main id="game" aria-label="子时已到游戏">
    <canvas id="unity-canvas" width="720" height="1334" tabindex="0" aria-label="游戏画面：长按瞄准，松手射击"></canvas>
    <section id="loading" aria-label="正在加载子时已到">
      <div id="loading-safe-area"></div>
      <div id="loading-art">
      <img id="logo" src="title.png?v=a83702502cb0" alt="子时已到">
      <div class="loading-progress">
        <p id="status" role="status">正在准备巡夜…</p>
        <div id="progress" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-track"><div id="progress-fill" class="empty"></div></div>
        </div>
        <span id="percent" aria-hidden="true">0%</span>
        <p id="control-hint">长按瞄准，松手射击</p>
      </div>
      </div>
      <div id="load-error-actions">
        <p id="error" class="hidden" role="alert"></p>
        <button id="retry" class="hidden">重新加载</button>
      </div>
    </section>
    <div id="storage-warning" class="hidden" role="status">当前浏览器无法持久保存进度，关闭页面后可能丢失。建议使用普通模式的 Safari 或 Chrome。</div>
  </main>
  <aside id="play-hint">长按瞄准，松手射击<br>推荐竖屏 · 各浏览器独立保存进度</aside>
  <script src="web-player.js?v=c69ac7cf85a4"></script>
</body>
</html>
