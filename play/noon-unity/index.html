<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#081a35">
  <meta name="description" content="子时已到：长按进入子弹时间，锁定幽灵，松手齐射。Unity 网页试玩。">
  <title>子时已到 · 网页试玩</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060e20;color:#f7e6b5;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#153958,#060e20 76%)}
    #game{position:relative;width:min(100vw,calc(100dvh * .54));height:100dvh;max-width:720px;overflow:hidden;background:#081b34;box-shadow:0 0 100px #0009}
    canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;-webkit-user-select:none;user-select:none}
    #loading{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:28px 24px max(48px,env(safe-area-inset-bottom));background:#081a35 url('loading.jpg') center/cover no-repeat}
    #logo{position:absolute;width:82%;top:max(20px,env(safe-area-inset-top));height:auto;filter:drop-shadow(0 4px 8px #001528)}
    .loading-panel{width:100%;padding:22px 18px;border:1px solid #4aa5be65;border-radius:20px;background:#071b38ee;box-shadow:0 8px 30px #0004;text-align:center}
    h1{font-size:20px;letter-spacing:.08em;margin:0 0 12px}p{line-height:1.6;margin:8px 0;font-size:14px;color:#bad5df}
    progress{width:100%;height:10px;accent-color:#56d4ea;border:0;border-radius:20px;overflow:hidden;margin:12px 0}progress::-webkit-progress-bar{background:#18394d}progress::-webkit-progress-value{background:linear-gradient(90deg,#2479c5,#80f4e0);border-radius:20px}
    button{font:inherit;font-weight:700;cursor:pointer;border:2px solid #edbc55;border-radius:40px;background:linear-gradient(#ffe9a0,#f9bf37);color:#213452;padding:13px 26px;min-height:48px;box-shadow:0 4px 0 #976022}
    button:focus-visible{outline:3px solid #83e8ff;outline-offset:4px}button:disabled{opacity:.7;cursor:wait}#start{width:100%;margin-top:10px}#retry{margin-top:10px}
    #error{color:#ffd8c5}#storage-warning{position:absolute;bottom:8px;left:8px;right:8px;z-index:5;padding:10px;background:#4d261fee;border-radius:8px;font-size:12px;text-align:center}
    .hidden{display:none!important}#loading.done{pointer-events:none;opacity:0;transition:opacity .35s}#play-hint{position:fixed;right:24px;bottom:22px;color:#7a9dad;font-size:12px;line-height:1.8;text-align:right;pointer-events:none}
    @media(max-width:760px){#game{width:100vw;max-width:none}#play-hint{display:none}}
    @media(prefers-reduced-motion:reduce){#loading.done{transition:none}}
  </style>
</head>
<body>
  <main id="game" aria-label="子时已到游戏">
    <canvas id="unity-canvas" width="720" height="1334" tabindex="0" aria-label="游戏画面：长按锁定，松手齐射"></canvas>
    <section id="loading" aria-live="polite">
      <img id="logo" src="title.png" alt="子时已到">
      <div class="loading-panel">
        <h1>月夜巡行，即刻出发</h1>
        <p>长按锁定幽灵，松手齐射</p>
        <progress id="progress" value="0" max="1" aria-label="游戏加载进度"></progress>
        <p id="status">准备好，开始今晚的巡夜。</p>
        <button id="start">开始试玩</button>
        <p id="error" class="hidden"></p>
        <button id="retry" class="hidden">重新加载</button>
        <p>进度保存在当前浏览器 · 试玩版未开放真实充值</p>
      </div>
    </section>
    <div id="storage-warning" class="hidden" role="status">当前浏览器无法持久保存进度，关闭页面后可能丢失。建议使用普通模式的 Safari 或 Chrome。</div>
  </main>
  <aside id="play-hint">长按鼠标或屏幕锁敌，松手射击<br>推荐竖屏 · 各浏览器独立保存进度</aside>
  <script src="web-player.js"></script>
</body>
</html>
